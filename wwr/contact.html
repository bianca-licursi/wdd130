<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Mendoza for trip questions and reservations. Find our address, phone, email, map, and send us a message.">
    <meta name="author" content="Bianca Licursi">
    <title>Contact Us | Rafting Mendoza</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo/logo.jpg" alt="Whitewater Rafting Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <h2>Get in Touch</h2>

            <address>
                Calle Ejemplo 123<br>
                Mendoza, Argentina<br>
                Phone: <a href="tel:+542610000000">+54 261 000 0000</a><br>
                Email: <a href="mailto:info@raftingmendoza.com">info@raftingmendoza.com</a>
            </address>

            <!-- Pegá acá el iframe de Google Maps y borrale style="border:0" -->
            <iframe class="map" src="PEGAR_URL_DEL_MAPA" title="Map of Rafting Mendoza location"
              loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Portrait of employee 1">
                <figcaption>Nombre Apellido<br>Head Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Portrait of employee 2">
                <figcaption>Nombre Apellido<br>Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Portrait of employee 3">
                <figcaption>Nombre Apellido<br>Safety Coordinator</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label><input type="radio" name="purpose" value="general" checked> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send
